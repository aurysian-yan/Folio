buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.folio.poc'
version = '0.1.0'

android {
  namespace 'com.folio.poc'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    minSdkVersion 28
    testInstrumentationRunner 'com.folio.poc.FolioSyncInstrumentation'
    consumerProguardFiles 'consumer-rules.pro'
  }
  sourceSets.main.java.srcDirs += 'generated'
  sourceSets.main.resources.srcDirs += 'third-party'
  buildFeatures { compose true }
}

dependencies {
  implementation 'androidx.activity:activity:1.10.1'
  implementation 'net.java.dev.jna:jna:5.19.1@aar'
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation 'org.jetbrains:annotations:26.1.0'
  testImplementation 'junit:junit:4.13.2'
  testRuntimeOnly 'net.java.dev.jna:jna:5.19.1'
  androidTestImplementation 'com.facebook.react:react-android:0.86.3'
}

android.testOptions.unitTests.all {
  systemProperty 'jna.library.path', rootProject.file('../../../target/debug').absolutePath
  systemProperty 'folio.samples', rootProject.file('../samples').absolutePath
}
