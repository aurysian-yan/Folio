buildscript {
  repositories { mavenCentral() }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.folio.poc'
version = '0.1.0'

expoModule { canBePublished false }

android {
  namespace 'com.folio.poc'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    minSdkVersion 30
    testInstrumentationRunner project.findProperty('folioUpdateTest') ? 'com.folio.poc.FolioUpdateInstrumentation' : project.findProperty('folioFileTest') ? 'com.folio.poc.FolioFileInstrumentation' : project.findProperty('folioPreviewTest') ? 'com.folio.poc.FolioPreviewInstrumentation' :
      project.findProperty('folioSliderTest') ? 'com.folio.poc.FolioSliderRefractionInstrumentation' :
      project.findProperty('folioSwitchTest') ? 'com.folio.poc.FolioSwitchRefractionInstrumentation' :
      project.findProperty('folioOnlineLoadingTest') ? 'com.folio.poc.FolioOnlineLoadingInstrumentation' :
      project.findProperty('folioBlobTest') ? 'com.folio.poc.FolioOnlineBlobInstrumentation' :
      project.findProperty('folioSyncTarget') ? 'com.folio.poc.FolioLiveSyncInstrumentation' : 'com.folio.poc.FolioSyncInstrumentation'
    consumerProguardFiles 'consumer-rules.pro'
  }
  if (project.findProperty('folioBackdropTest')) {
    defaultConfig.testInstrumentationRunner 'com.folio.poc.navigation.FolioGlasmioBackdropInstrumentation'
    sourceSets.androidTest {
      java.setSrcDirs(['src/androidTestGlasmio/java'])
      manifest.srcFile 'src/androidTestGlasmio/AndroidManifest.xml'
    }
  }
  sourceSets.main.java.srcDirs += 'generated'
  sourceSets.main.resources.srcDirs += 'third-party'
  sourceSets.androidTest.assets.srcDirs += ['../../../samples', '../../../../../locales']
  if (project.findProperty('folioUpdateTest')) sourceSets.androidTest.assets.srcDirs += ['../../../.build/update-test-assets']
  buildFeatures { compose true; buildConfig true }
  flavorDimensions += 'glassTier'
  productFlavors {
    legacy {
      dimension 'glassTier'
      minSdk 30
      manifestPlaceholders.folioGlassTier = 'legacy'
    }
    glasmio {
      dimension 'glassTier'
      minSdk 33
      manifestPlaceholders.folioGlassTier = 'glasmio'
    }
  }
  if (project.findProperty('folioSyncTarget')) {
    signingConfigs.debug {
      storeFile rootProject.file('app/debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
  }
}

// rustls-platform-verifier 的 Maven 仓库由 app.config.ts 的
// ./plugins/with-rustls-verifier-repo 写入根工程 allprojects.repositories。
// 不能在这里用 rootProject.allprojects 追加：expo run:android 固定带
// --configure-on-demand，:app 会在子模块注册仓库前解析 debugRuntimeClasspath。

// 安卓校验器版本必须与 Cargo 锁文件一致。
def folioCargoLock = file('../../../../../Cargo.lock').text
def folioVerifierVersion = (folioCargoLock =~ /name = "rustls-platform-verifier-android"\s+version = "([^"]+)"/)
if (!folioVerifierVersion.find()) throw new GradleException('Cargo.lock 缺少安卓证书校验器')

dependencies {
  implementation 'androidx.work:work-runtime-ktx:2.11.2'
  implementation "org.rustls:rustls-platform-verifier:${folioVerifierVersion.group(1)}"
  implementation 'androidx.activity:activity:1.10.1'
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
  implementation 'net.java.dev.jna:jna:5.19.1@aar'
  legacyImplementation 'androidx.compose.foundation:foundation-android:1.10.6'
  legacyImplementation 'androidx.compose.ui:ui-android:1.10.6'
  glasmioImplementation platform('androidx.compose:compose-bom:2026.09.00')
  glasmioImplementation 'androidx.compose.foundation:foundation-android:1.12.1'
  glasmioImplementation 'androidx.compose.ui:ui-android'
  glasmioImplementation project(':glasmio-ui')
  // Material3 色彩工具：由种子色生成完整语义色板，供外观主题使用。
  implementation 'com.google.android.material:material:1.13.0'
  implementation 'org.jetbrains:annotations:26.1.0'
  compileOnly 'com.facebook.react:react-android:0.86.3'
  testImplementation 'junit:junit:4.13.2'
  testRuntimeOnly 'net.java.dev.jna:jna:5.19.1'
  androidTestImplementation 'com.facebook.react:react-android:0.86.3'
}

android.testOptions.unitTests.all {
  systemProperty 'jna.library.path', rootProject.file('../../../target/debug').absolutePath
  systemProperty 'folio.samples', rootProject.file('../samples').absolutePath
}

// 仅显式实网测试构建读取目标开发包的私有配置与 Keystore。
tasks.withType(com.android.build.gradle.tasks.ProcessTestManifest).configureEach {
  if (project.findProperty('folioSyncTarget')) {
    inputs.property('folioSyncTarget', project.property('folioSyncTarget').toString())
    doLast {
      def manifest = new File(packagedManifestOutputDirectory.get().asFile, 'AndroidManifest.xml')
      manifest.text = manifest.text.replaceAll(/android:targetPackage="[^"]+"/,
        "android:targetPackage=\"${project.property('folioSyncTarget')}\"")
    }
  }
}
