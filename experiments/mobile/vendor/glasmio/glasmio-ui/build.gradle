buildscript {
    repositories { mavenCentral() }
    dependencies {
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${rootProject.ext.kotlinVersion}"
    }
}
apply from: rootProject.file('../vendor/glasmio/library.gradle')
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android { namespace 'io.github.neoruaa.glasmio.ui' }

dependencies {
    api platform("androidx.compose:compose-bom:2026.09.00")
    api("androidx.compose.ui:ui")
    api("androidx.compose.foundation:foundation:1.12.1")
    api("androidx.compose.material3:material3:1.5.0-beta02")
    testImplementation("junit:junit:4.13.2")
    api project(":glasmio-glass")
    implementation("androidx.activity:activity-compose:1.13.0")
    implementation("sh.calvin.reorderable:reorderable:3.1.0")
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
