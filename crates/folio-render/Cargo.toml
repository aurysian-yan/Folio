[package]
name = "folio-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
folio-core = { path = "../folio-core" }
skrifa.workspace = true
read-fonts.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "png", "text", "u8_pipeline"] }
resvg = { version = "=0.48.1", default-features = false, features = ["svgz", "raster-images"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
base64 = "=0.22.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
imagesize = "=0.15.0"

[dev-dependencies]
font-test-data = "=0.9.1"
tempfile = "3"
