[workspace]
resolver = "2"
members = ["crates/folio-core", "crates/folio-cli", "crates/folio-storage", "crates/folio-query", "crates/folio-ffi", "crates/folio-sync", "crates/folio-online"]
exclude = ["apps/desktop-ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
read-fonts = "0.44"
skrifa = "0.47"
unicode-normalization = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
bincode = "1.3"
unicode-script = "=0.5.8"
getrandom = "=0.4.3"
uniffi = "=0.32.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "sync", "fs", "macros"] }
quick-xml = "=0.42.0"
sha1 = "=0.10.6"
