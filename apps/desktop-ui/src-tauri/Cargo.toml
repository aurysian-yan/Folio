[package]
name = "folio-desktop"
version = "0.1.0"
description = "Folio desktop application"
authors = ["Folio"]
edition = "2021"
rust-version = "1.91"

[lib]
name = "folio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
folio-core = { path = "../../../crates/folio-core" }
folio-query = { path = "../../../crates/folio-query" }
folio-storage = { path = "../../../crates/folio-storage" }
folio-sync = { path = "../../../crates/folio-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
font-kit = "0.14.3"
png = "=0.17.16"
base64 = "0.22.1"
pathfinder_geometry = "0.5.1"
tauri-plugin-dialog = "2.7.3"
window-vibrancy = "0.8.1"
keyring = "=4.2.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4.1"
