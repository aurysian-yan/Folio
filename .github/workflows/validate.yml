name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/toolchain
      - run: pnpm --dir experiments/mobile install --frozen-lockfile
      - run: node tools/releases/release.mjs verify
      - run: node tools/about/validate.mjs
      - run: pnpm i18n:validate
      - run: pnpm --dir apps/desktop-ui typecheck && pnpm --dir apps/desktop-ui lint && pnpm --dir apps/desktop-ui test && pnpm --dir apps/desktop-ui build
      - run: pnpm --dir experiments/mobile typecheck && pnpm --dir experiments/mobile lint && pnpm --dir experiments/mobile test
      - run: node --test tools/releases/release.test.mjs
      - run: cargo test --locked --workspace
